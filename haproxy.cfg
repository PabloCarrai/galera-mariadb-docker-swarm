global
    log /dev/log local0

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5s
    timeout client  50000s
    timeout server  50000s

resolvers docker
    nameserver dns 127.0.0.11:53

frontend mysql_front
    bind *:3306
    default_backend mysql_back

backend mysql_back
    balance roundrobin
    option tcp-check
    server mariadb-1 mariadb-1:3306 resolvers docker resolve-prefer ipv4 check inter 5s rise 2 fall 3
    server mariadb-2 mariadb-2:3306 resolvers docker resolve-prefer ipv4 check inter 5s rise 2 fall 3
    server mariadb-3 mariadb-3:3306 resolvers docker resolve-prefer ipv4 check inter 5s rise 2 fall 3

frontend stats
    bind *:8404
    mode http
    option httplog
    stats enable
    stats uri /stats
    stats refresh 5s
    stats auth jaimeros:Sim3v0y4ntesQuevoS.
